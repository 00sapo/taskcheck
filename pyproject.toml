[project]
name = "taskcheck"
version = "1.1.2"
description = "Automatic scheduler for taskwarrior"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "appdirs>=1.4.4",
  "google-api-python-client>=2.198.0",
  "google-auth>=2.56.2",
  "google-auth-oauthlib>=1.2.2",
  "icalendar>=6.0.1",
  "random-unicode-emoji>=2.8",
  "requests>=2.32.3",
  "rich>=13.9.4",
]

[project.scripts]
taskcheck = "taskcheck.__main__:main"

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
license-files = []

[tool.setuptools.packages.find]
where = ["."]
include = ["taskcheck*"]

[tool.uv]
package = true

[dependency-groups]
dev = [
  "freezegun>=1.5.2",
  "pytest>=8.3.5",
  "pytest-cov>=6.1.1",
  "pytest-mock>=3.14.1",
  "responses>=0.25.7",
]
